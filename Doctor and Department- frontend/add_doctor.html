<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Doctor</title>
<link rel="stylesheet" href="doctor_department.css">
<section class="doctor-form">

    <div class="form-header">
        <h2>Add New Doctor</h2>
        <p>Enter the doctor's professional information.</p>
    </div>


    <form id="doctorForm">

        <div class="form-row">

            <div class="form-group">
                <label for="specialization">
                    Specialization
                </label>

                <input
                    type="text"
                    id="specialization"
                    name="specialization"
                    placeholder="e.g. Cardiology"
                    required
                >
            </div>


            <div class="form-group">
                <label for="qualification">
                    Qualification
                </label>

                <input
                    type="text"
                    id="qualification"
                    name="qualification"
                    placeholder="e.g. MD"
                    required
                >
            </div>

        </div>


        <div class="form-row">

            <div class="form-group">
                <label for="experience">
                    Experience
                </label>

                <input
                    type="number"
                    id="experience"
                    name="experience"
                    placeholder="Years of experience"
                    min="0"
                    required
                >
            </div>


            <div class="form-group">
                <label for="phone">
                    Phone
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter phone number"
                    required
                >
            </div>

        </div>


        <div class="form-row">

            <div class="form-group">
                <label for="workingDays">
                    Working Days
                </label>

                <input
                    type="text"
                    id="workingDays"
                    name="working_days"
                    placeholder="e.g. Monday - Friday"
                    required
                >
            </div>


            <div class="form-group">
                <label for="workingHours">
                    Working Hours
                </label>

                <input
                    type="text"
                    id="workingHours"
                    name="working_hours"
                    placeholder="e.g. 8:00 AM - 4:00 PM"
                    required
                >
            </div>

        </div>


        <div class="form-row">

            <div class="form-group">

                <label for="department">
                    Department
                </label>

                <select
                    id="department"
                    name="Departments_id"
                    required
                >

                    <option value="">
                        Select Department
                    </option>

                    <!-- Departments will come from database later -->

                </select>

            </div>


            <div class="form-group">

                <label for="user">
                    Doctor User
                </label>

                <select
                    id="user"
                    name="users_id"
                    required
                >

                    <option value="">
                        Select User
                    </option>

                    <!-- Users will come from database later -->

                </select>

            </div>

        </div>


        <div class="form-actions">

            <button type="reset">
                Cancel
            </button>

            <button type="submit">
                <i class="fa-solid fa-plus"></i>
                Add Doctor
            </button>

        </div>

    </form>

</section>
