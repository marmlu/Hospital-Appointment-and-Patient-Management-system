<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link href="css/style.css" rel="stylesheet" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        />
        <title></title>
    </head>
    <body>
        <section class="nav-container">
            <nav class="sidebar">
                <div class="logoContainer">
                    <div class="logo">
                        <i class="fa-solid fa-heart-pulse"></i>
                    </div>
                    <div class="logoSide">
                        <span class="logoName">EthioCare</span>
                        <span>Hospital Management</span>
                    </div>
                </div>

                <hr />
                <p class="sectionName">Main Menu</p>
                <ul class="list">
                    <li><i class="fa-solid fa-house"></i> Dashboard</li>
                    <li><i class="fa-solid fa-user-group"></i> Users</li>
                    <li><i class="fa-solid fa-users"></i> Patients</li>
                    <li><i class="fa-solid fa-user-doctor"></i> Doctors</li>
                    <li><i class="fa-solid fa-building"></i> Departments</li>
                    <li class="appointment">
                        <i class="fa-solid fa fa-calendar-check"></i>
                        Appointments
                    </li>
                    <li>
                        <i class="fa-solid fa-file-medical"></i> Medical Records
                    </li>
                    <li>
                        <i class="fa-solid fa-file-prescription"></i>
                        Prescriptions
                    </li>
                    <li><i class="fa-solid fa-chart-column"></i> Reports</li>
                    <li><i class="fa-solid fa-gear"></i> Settings</li>
                </ul>

                <hr class="secondSection" />
                <p class="secondSectionName">Others</p>
                <ul class="list">
                    <li>
                        <i class="fa-solid other fa-circle-user"></i> Profile
                    </li>
                    <li>
                        <i
                            class="fa-solid other fa-arrow-right-from-bracket"
                        ></i>
                        Logout
                    </li>
                </ul>
            </nav>
            <nav class="navbar">
                <p>Appointments here</p>
                <ul>
                    <i class="main-search fa-magnifying-glass"></i>
                    <input
                        class="search-apppointments"
                        placeholder="Search appointments"
                    />
                </ul>
            </nav>
        </section>
    </body>
</html>
