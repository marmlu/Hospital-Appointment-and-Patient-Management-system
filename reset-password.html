<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — EthioCare Hospital</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body class="auth-page">

<nav class="navbar">
  <div class="navbar-brand">
    <div class="brand-logo"><svg viewBox="0 0 32 32" fill="none"><path d="M16 28S4 20.5 4 13a8 8 0 0112-6.93A8 8 0 0128 13c0 7.5-12 15-12 15z" fill="rgba(255,255,255,0.15)" stroke="white" stroke-width="2"/><polyline points="5,16 8,16 10.5,10 13.5,22 16.5,13 18.5,18 22,18 24,16" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></div>
    <div class="brand-text"><h1>EthioCare</h1><span>Hospital</span></div>
  </div>
  <div class="navbar-center">
    <a href="index.html">Home</a>
    <a href="login.html">Login</a>
    <a href="register.html">Register</a>
  </div>
  <div class="navbar-right">
    <a href="login.html" class="btn-book">
      <svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      Sign In
    </a>
  </div>
  <button class="navbar-toggle" id="navbarToggle"><span></span><span></span><span></span></button>
</nav>

<div class="mobile-overlay" id="mobileOverlay"></div>
<div class="navbar-links-mobile" id="mobileMenu">
  <a href="index.html"><i class="fa fa-home" style="margin-right:10px;color:#60a5fa;"></i>Home</a>
  <div class="mobile-divider"></div>
  <a href="login.html" class="mobile-btn-login"><i class="fa fa-sign-in-alt" style="margin-right:10px;"></i>Login</a>
  <a href="register.html" class="mobile-btn-register"><i class="fa fa-user-plus" style="margin-right:10px;"></i>Register</a>
</div>

<div class="auth-wrapper">
  <div class="auth-card">

    <div class="auth-logo">
      <div class="logo-icon"><svg viewBox="0 0 24 24"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 11-7.778 7.778 5.5 5.5 0 017.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg></div>
      <span>EthioCare Hospital</span>
    </div>

    <div class="auth-header">
      <h2>Reset Password</h2>
      <p>Create a new strong password for your account.</p>
    </div>

    <div id="resetAlert"></div>

    <form id="resetForm" novalidate>

      <div class="form-group">
        <label for="resetPassword"><i class="fa fa-lock" style="margin-right:6px;color:#1a56db;"></i>New Password</label>
        <div class="input-password-wrap">
          <input type="password" id="resetPassword" name="password" placeholder="Min. 6 characters" autocomplete="new-password" />
          <button type="button" class="toggle-password" data-target="resetPassword">👁</button>
        </div>
      </div>

      <div class="form-group">
        <label for="resetConfirm"><i class="fa fa-lock" style="margin-right:6px;color:#1a56db;"></i>Confirm New Password</label>
        <div class="input-password-wrap">
          <input type="password" id="resetConfirm" name="confirmPassword" placeholder="Re-enter new password" autocomplete="new-password" />
          <button type="button" class="toggle-password" data-target="resetConfirm">👁</button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-full" style="margin-bottom:12px;">
        <i class="fa fa-key"></i> Reset Password
      </button>

      <a href="login.html" class="btn btn-secondary btn-full">
        <i class="fa fa-arrow-left"></i> Back to Login
      </a>

    </form>

  </div>
</div>

<footer style="padding:24px 40px;">
  <div class="footer-bottom" style="border-top:none;padding-top:0;max-width:1200px;margin:0 auto;">
    <p>© 2026 EthioCare Hospital Management System. All rights reserved.</p>
    <div class="footer-socials"><a href="#">f</a><a href="#">t</a><a href="#">in</a></div>
  </div>
</footer>

<script src="js/auth.js"></script>
<script>
  var _t = document.getElementById("navbarToggle");
  var _m = document.getElementById("mobileMenu");
  var _o = document.getElementById("mobileOverlay");
  function navOpen(){
    if(!_m) return;
    _m.style.display = "flex";
    setTimeout(function(){ _m.classList.add("open"); }, 10);
    if(_t) _t.classList.add("active");
    if(_o) _o.classList.add("show");
    document.body.style.overflow = "hidden";
  }
  function navClose(){
    if(!_m) return;
    _m.classList.remove("open");
    if(_t) _t.classList.remove("active");
    if(_o) _o.classList.remove("show");
    document.body.style.overflow = "";
    setTimeout(function(){ if(!_m.classList.contains("open")) _m.style.display = "none"; }, 300);
  }
  if(_t){ _t.addEventListener("click", function(){ _m.classList.contains("open") ? navClose() : navOpen(); }); }
  if(_o){ _o.addEventListener("click", navClose); }
  if(_m){ _m.querySelectorAll("a").forEach(function(a){ a.addEventListener("click", navClose); }); }
  document.addEventListener("keydown", function(e){ if(e.key === "Escape") navClose(); });
</script>
</body>
</html>
